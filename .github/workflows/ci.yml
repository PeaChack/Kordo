# Tests on Windows (part of the packages and the golden configs are Windows-only),
# the installer is cross-built on Linux. A tag v* publishes a GitHub release.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: vet + tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go' | grep -v '^third_party/'))"
          if [ -n "$out" ]; then echo "not gofmt-ed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: |
          tags="$(tr -d '[:space:]' < build/tags.txt)"
          go vet -tags "$tags" ./...
          go vet -tags desktop,production ./windows/gui
      - name: go test
        run: go test -tags "$(tr -d '[:space:]' < build/tags.txt)" ./...

  test-linux:
    name: tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -tags "$(tr -d '[:space:]' < build/tags.txt)" ./...
      - name: go vet (windows target)
        run: |
          tags="$(tr -d '[:space:]' < build/tags.txt)"
          GOOS=windows go vet -tags "$tags" ./...
          GOOS=windows go vet -tags desktop,production ./windows/gui

  ui:
    name: UI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run
        run: node build/ui-smoke.js

  installer:
    name: installer (cross-built on Linux)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Version
        id: version
        run: |
          base="$(tr -d '[:space:]' < build/version.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            if [[ "${v%%[-+]*}" != "$base" ]]; then
              echo "::warning::tag $GITHUB_REF_NAME does not match build/version.txt ($base)"
            fi
          else
            v="$base-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Code signing (only if the repository has the secrets)
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if [ -z "$SIGN_PFX_BASE64" ]; then echo "no certificate: building unsigned"; exit 0; fi
          sudo apt-get install -y -q osslsigncode
          echo "$SIGN_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/sign.pfx"
          {
            echo "KORDO_PFX=$RUNNER_TEMP/sign.pfx"
            echo "KORDO_PFX_PASSWORD=$SIGN_PFX_PASSWORD"
            echo "KORDO_SIGN_CMD=$GITHUB_WORKSPACE/build/sign-osslsigncode.sh"
          } >> "$GITHUB_ENV"
      - name: Build binaries and installer
        run: build/build-installer.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Kordo-Setup-${{ steps.version.outputs.version }}
          path: |
            dist/Kordo-Setup-*.exe
            dist/Kordo-Setup-*.exe.sha256
          if-no-files-found: error

  android:
    name: Android APK
    needs: installer
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Release keystore (only if the repository has the secrets)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "no keystore: the APK is signed with a debug key"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KORDO_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "KORDO_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "KORDO_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "KORDO_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: build/build-android.sh "${{ needs.installer.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Kordo-${{ needs.installer.outputs.version }}-android
          path: |
            dist/Kordo-*.apk
            dist/Kordo-*.apk.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-linux, ui, installer, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kordo-Setup-${{ needs.installer.outputs.version }}
          path: dist
      # Only a release-key APK is published: debug-signed builds cannot update each other.
      - uses: actions/download-artifact@v4
        if: needs.android.outputs.signed == 'true'
        with:
          name: Kordo-${{ needs.installer.outputs.version }}-android
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.installer.outputs.version }}
        run: |
          cd dist
          sha256sum -c "Kordo-Setup-$VERSION.exe.sha256"
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          files=("Kordo-Setup-$VERSION.exe" "Kordo-Setup-$VERSION.exe.sha256")
          if [ -f "Kordo-$VERSION.apk" ]; then
            sha256sum -c "Kordo-$VERSION.apk.sha256"
            files+=("Kordo-$VERSION.apk" "Kordo-$VERSION.apk.sha256")
          fi
          {
            echo "### Windows"
            echo "Скачайте \`Kordo-Setup-$VERSION.exe\` и запустите (нужны права администратора)."
            echo "Установщик не подписан: SmartScreen может предупредить («Подробнее» → «Выполнить в любом случае»)."
            if [ -f "Kordo-$VERSION.apk" ]; then
              echo
              echo "### Android"
              echo "Скачайте \`Kordo-$VERSION.apk\` на телефон и откройте (Android 8.0+; разрешите установку из этого источника)."
            fi
            echo
            echo "SHA-256:"
            echo '```'
            cat ./*.sha256
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kordo $VERSION" \
            --notes-file notes.md --generate-notes "${flags[@]}" \
            "${files[@]}"
